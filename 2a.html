<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Example</title>
</head>
<body>
    <h2 align="center">Table Example</h2>
    <table border="2" align="center" cellpadding="8" width="60%">
        <tr>
            <th colspan="4">Student Details</th>
        </tr>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
            <th>Phone No</th>
        </tr>
        <tr>
            <td>Krishnateja</td>
            <td>20</td>
            <td>CST</td>
            <td>7997118965</td>
        </tr>
        <tr>
            <td>Aditya</td>
            <td>20</td>
            <td>CST</td>
            <td>9701583667</td>
        </tr>
    </table>
</body>
</html>
